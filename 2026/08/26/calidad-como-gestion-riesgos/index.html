}

.lang-switch-thumb {
  width: 14px;

  background: var(--muted);
  border-radius: 50%;
  position: absolute;
  top: 2px;
  left: 2px;
  transition: transform .25s, background .25s;
  display: block;
}

.lang-switch-btn.active .lang-switch-track {
  background: var(--accent);

  transform: translateX(18px);
  background: white;

  font-weight: 500;

<script>
(function () {
  var isEN = false;

  window.togglePostLang = function () {
    isEN = !isEN;

    var esBlock = document.getElementById('postContentEs');
    var enBlock = document.getElementById('postContentEn');
    var btn     = document.getElementById('langSwitchBtn');
    var label   = document.getElementById('langLabel');
    var btnText = document.getElementById('langSwitchText');
    var title   = document.getElementById('postTitle');
    var titleEs = document.getElementById('postTitleEs');
    var titleEn = document.getElementById('postTitleEn');

    if (isEN) {
      esBlock.style.display = 'none';
      enBlock.style.display = 'block';
      enBlock.style.animation = 'none';
      enBlock.offsetHeight;
      enBlock.style.animation = '';
      btn.classList.add('active');
      label.textContent = 'English version';
      btnText.textContent = 'ES';
      if (title && titleEn) title.textContent = titleEn.textContent;
    } else {
      enBlock.style.display = 'none';
      esBlock.style.display = 'block';
      esBlock.style.animation = 'none';
      esBlock.offsetHeight;
      esBlock.style.animation = '';
      btn.classList.remove('active');
      label.textContent = 'Versión en español';
      btnText.textContent = 'EN';
      if (title && titleEs) title.textContent = titleEs.textContent;
    }
  };
})();
</script>
