<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>
    {% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}
  </title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <!-- SEO -->
  {% seo %}
</head>
<body>

  <!-- Mobile menu -->
  <div class="mobile-menu" id="mobileMenu">
    <button class="mobile-close" onclick="toggleMenu()">✕</button>
    <a href="{{ '/' | relative_url }}">Inicio</a>
    <a href="{{ '/articulos/' | relative_url }}">Artículos</a>
    <a href="{{ '/categorias/' | relative_url }}">Categorías</a>
    <a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a>
    <a href="{{ '/newsletter/' | relative_url }}">Newsletter</a>
  </div>

  <!-- Nav -->
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-logo">
      QA <em>Insights</em>
    </a>
    <ul class="nav-links">
      <li><a href="{{ '/' | relative_url }}">Inicio</a></li>
      <li><a href="{{ '/articulos/' | relative_url }}">Artículos</a></li>
      <li><a href="{{ '/categorias/' | relative_url }}">Categorías</a></li>
      <li><a href="{{ '/sobre-mi/' | relative_url }}">Sobre mí</a></li>
      <li><a href="{{ '/newsletter/' | relative_url }}" class="nav-cta">Newsletter</a></li>
    </ul>
    <button class="hamburger" onclick="toggleMenu()" aria-label="Menú">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <!-- Contenido principal -->
  <main>
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <p>
      © {{ 'now' | date: "%Y" }} {{ site.title }} ·
      Escrito desde Madrid con ☕ ·
      <a href="{{ site.author.linkedin }}" target="_blank" rel="noopener">LinkedIn</a> ·
      <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </p>
  </footer>

  <!-- JS -->
  <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
