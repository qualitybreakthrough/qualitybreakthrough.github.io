---
layout: default
---
<article class="test-case">
  <div class="tc-header">
    <span class="tc-id">TC-{{ page.date | date: "%Y%m%d" }}</span>
    <span class="badge {{ page.status | default: "pass" }}">{{ page.status | default: "PASSED" | upcase }}</span>
  </div>
  <h1>{{ page.title }}</h1>
  <p class="tc-meta">ejecutado el {{ page.date | date: "%d/%m/%Y" }} · tags: {{ page.tags | join: ", " }}</p>
  <div class="tc-body">
    {{ content }}
  </div>
</article>
