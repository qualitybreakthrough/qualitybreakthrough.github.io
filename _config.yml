# ─────────────────────────────────────────
#  QA Insights — GitHub Pages / Jekyll config
# ─────────────────────────────────────────
title: "QA Insights"
description: "Reflexiones reales sobre calidad de software, liderazgo de equipos e IA aplicada al testing."
baseurl: ""           # cambia a "/nombre-repo" si el site NO es tu usuario principal
url: "https://tuusuario.github.io"  # reemplaza con tu URL real

author:
  name: "Antonio"
  role: "Head of QA · Carrefour Spain"
  bio: "15+ años en calidad de software en grandes organizaciones. Escribo sobre lo que aprendo gestionando equipos, procesos y la adopción de IA en QA. Sin filtros corporativos."
  initials: "A"
  linkedin: "https://linkedin.com/in/tuusuario"
  email: "tu@email.com"

# Categorías del site (icono + slug + label)
categories_list:
  - slug: qa-strategy
    icon: "🧪"
    label: "QA Strategy"
  - slug: liderazgo
    icon: "👥"
    label: "Liderazgo"
  - slug: ia-automatizacion
    icon: "🤖"
    label: "IA & Automatización"
  - slug: metricas
    icon: "📊"
    label: "Métricas & Reporting"
  - slug: herramientas
    icon: "🏗️"
    label: "Herramientas"
  - slug: carrera
    icon: "💼"
    label: "Carrera profesional"
  - slug: proveedores
    icon: "🌐"
    label: "Proveedores & Outsourcing"
  - slug: opinion
    icon: "📝"
    label: "Reflexiones & Opinión"

# Stats de la franja hero (actualiza a mano o automatiza con plugin)
stats:
  articles_label: "Artículos"
  readers_label: "Lectores/mes"
  topics_label: "Temáticas"
  experience_label: "Años experiencia"
  experience_value: "15+"

# Número de posts en la home
paginate: 6
paginate_path: "/page:num/"

# Jekyll settings
markdown: kramdown
highlighter: rouge
permalink: /:categories/:year/:month/:day/:title/

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins habilitados en GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate
  - jekyll-sitemap

# Excluir de build
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - .gitignore
